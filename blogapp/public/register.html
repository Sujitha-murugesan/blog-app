<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Create a free BlogApp account and start publishing your own posts." />
  <meta name="theme-color" content="#ffffff" />
  <title>Register | BlogApp</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <header id="navbar"></header>
  <main id="main" class="container" tabindex="-1">
    <noscript><p class="notice">BlogApp needs JavaScript to work. Please enable it in your browser.</p></noscript>
    <div class="card form-card">
      <h1>Create your account</h1>
      <p class="subtitle">It only takes a minute.</p>
      <form id="registerForm" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required autocomplete="name" maxlength="60" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" required autocomplete="new-password" aria-describedby="pwHint" />
        <p class="hint" id="pwHint">Use 8 or more characters with at least one letter and one number.</p>
        <div class="strength"><span id="strengthBar"></span></div>
        <div class="strength-label" id="strengthLabel" aria-live="polite"></div>
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Repeat your password" required autocomplete="new-password" />
        <label class="inline-check"><input type="checkbox" id="showPw" /> Show passwords</label>
        <div class="field-error" id="formError" role="alert"></div>
        <button class="btn btn-block" type="submit">Create account</button>
      </form>
      <p class="form-footer">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
