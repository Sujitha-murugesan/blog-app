<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Log in to your BlogApp account to write and manage your posts." />
  <meta name="theme-color" content="#ffffff" />
  <title>Log in | BlogApp</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="navbar"></header>
  <main id="main" class="container" tabindex="-1">
    <noscript><p class="notice">BlogApp needs JavaScript to work. Please enable it in your browser.</p></noscript>
    <div class="card form-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your posts.</p>
      <div class="notice" id="notice" role="status"></div>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required autocomplete="current-password" />
        <label class="inline-check"><input type="checkbox" id="showPw" /> Show password</label>
        <div class="field-error" id="formError" role="alert"></div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="form-footer">No account yet? <a href="register.html">Register</a></p>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
